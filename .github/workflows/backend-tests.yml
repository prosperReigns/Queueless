name: Backend tests

on:
  push:
    branches:
      - feature/qless-phase-3
      - feature/qless-phase-6
      - feature/qless-phase-7
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/queueless_test
      JWT_SECRET_KEY: 01234567890123456789012345678901
      SECRET_KEY: 01234567890123456789012345678901
      PAYSTACK_SECRET_KEY: test_paystack_secret
      PAYSTACK_PUBLIC_KEY: pk_test_queueless
      FCM_CREDENTIALS: "{}"
      REDIS_URL: redis://localhost:6379/0
      PAYMENT_CURRENCY: NGN
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
